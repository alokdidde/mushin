[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mushin"
version = "0.1.0"
description = "Compact System-1 decision model for uzumaki's skill planner."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23", "pyyaml>=6.0"]

[project.optional-dependencies]
# MuJoCo data generation needs an uzumaki checkout too (scripts/fetch_uzumaki.sh).
sim = ["mujoco==3.14.0", "numpy==2.5.4", "onnxruntime==1.31.0", "pillow>=11"]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["mushin*"]

[tool.setuptools.package-data]
mushin = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
