# Benchmark of the SFT warm-up checkpoint: offline decision metrics on val/test/test_body
# (mushin.eval.run) and per-decision latency and memory (mushin.export.latency).
name: bench-warmup
image: runpod/base:1.0.2-cuda1281-ubuntu2404
extras: train,gpu
resources: {min_gpu_gb: 24, min_vcpus: 8, est_hours_per_unit: 0.3}   # unit: 50k decisions, 4090
work_units: 1
command: >-
  python -m mushin.data.finalize data/m4 --config configs/data_m0.yaml &&
  hf download alokdidde/mushin-runs --include "sft-warmup/qwen35_08b_warmup/checkpoint.pt" "sft-warmup/qwen35_08b_warmup/*.json" --local-dir ckpt &&
  mkdir -p runs &&
  python -m mushin.export.latency --data data/m4 --checkpoint ckpt/sft-warmup/qwen35_08b_warmup/checkpoint.pt --records 50 --out runs/latency.json &&
  python -m mushin.eval.run --checkpoint ckpt/sft-warmup/qwen35_08b_warmup/checkpoint.pt --data data/m4 --out runs/eval.json
out_dir: runs
max_hours: 1.5
budget_usd: 2
secrets: [HF_TOKEN]
env: {MUSHIN_DATA_REPO: alokdidde/mushin-sim-decisions-v1, MUSHIN_OUT_REPO: alokdidde/mushin-runs,
      MUSHIN_OUT_PREFIX: bench/sft-warmup}
