# M4: generate the full dataset (~200k decisions) on a CPU pod and upload it to the Hub.
name: m4-data
image: runpod/base:1.0.2-ubuntu2404   # confirm the tag against RunPod's templates before the first start
extras: sim,dev
resources:
  min_gpu_gb: 0
  min_vcpus: 32
  core_hours_per_unit: 1.6   # measured here: ~0.18 decisions/s/core with frames and counterfactuals
work_units: 200              # thousands of decisions
command: >-
  python -m mushin.data.generate --out data/m4 --episodes 80000 --family m4 --workers $(nproc) &&
  python -m mushin.data.splits data/m4 --config configs/data_m0.yaml &&
  python -m mushin.data.verify data/m4 --reproduce 200 &&
  hf upload "$MUSHIN_DATA_REPO" data/m4 --repo-type dataset --private
out_dir: data/m4
max_hours: 14
disk_gb: 40
budget_usd: 15
secrets: [HF_TOKEN]
env: {MUSHIN_DATA_REPO: alokdidde/mushin-m4}
