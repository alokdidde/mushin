# CPU smoke run (M1 gate): a tiny byte-level transformer overfits 200 records end to end.
stage: lora            # tiny backbone: trained in full in this stage
backbone: {kind: tiny, hidden_size: 64, layers: 2, heads: 4}
head_width: 64
data:
  dir: data/m0
  train_splits: null   # null: every record, no splits.json needed
  eval_splits: train   # evaluate on the training records (overfit check)
  limit: 200
  frames: true
train:
  device: cpu
  epochs: 40
  batch_size: 16
  lr: 1.0e-3
  head_lr: 1.0e-3
  warmup_steps: 20
  log_every: 25
  seed: 0
out: runs/sft_tiny
